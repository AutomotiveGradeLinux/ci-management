# AGL Trout 19.92.0 release (scarthgap / Yocto 5.x)
# All repos pinned to trout_19.92.0 manifest SHAs

header:
  version: 14
  includes:
    - file: common.yml

build_system: oe

repos:
  # ── Yocto / OpenEmbedded ───────────────────────────────────────────────────
  poky:
    url: https://git.yoctoproject.org/poky
    refspec: bab0f9f62af9af580744948dd3240f648a99879a
    path: external/poky

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    refspec: e92d0173a80ea7592c866618ef5293203c50544c
    path: external/meta-openembedded

  meta-lts-mixins-rust:
    url: https://git.yoctoproject.org/meta-lts-mixins
    refspec: a8046d5ec53b1856169ac795aa87cb0d5db84c04
    path: external/meta-lts-mixins_rust

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    refspec: 9e040ee8dd6025558ea60ac9db60c41bfeddf221
    path: external/meta-virtualization

  # ── AGL core layers ────────────────────────────────────────────────────────
  meta-agl:
    url: https://gerrit.automotivelinux.org/gerrit/AGL/meta-agl
    refspec: refs/tags/trout/19.92.0
    path: meta-agl

  meta-agl-demo:
    url: https://gerrit.automotivelinux.org/gerrit/AGL/meta-agl-demo
    refspec: refs/tags/trout/19.92.0
    path: meta-agl-demo

  meta-agl-devel:
