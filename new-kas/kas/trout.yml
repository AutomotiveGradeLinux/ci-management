    refspec: 57fef415fcde6c3d70a028f42f318f455633dc97
    path: external/meta-qt6

  meta-security:
    url: https://git.yoctoproject.org/meta-security
    refspec: bc865c5276c2ab4031229916e8d7c20148dfbac3
    path: external/meta-security

  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    refspec: c4b059262089b74c8fbf8dd5fdf5fd7bc1deeddc
    path: external/meta-selinux

  meta-clang:
