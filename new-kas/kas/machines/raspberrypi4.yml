header:
  version: 14

machine: raspberrypi4-64

bblayers_conf_header:
  rpi_bsp: |
    BBLAYERS += "${TOPDIR}/../bsp/meta-raspberrypi"
    BBLAYERS += "${TOPDIR}/../bsp/meta-lts-mixins_u-boot"

local_conf_header:
  machine_conf: |
    require conf/include/agl_raspberrypi4-64.inc
  fstypes: |
    IMAGE_FSTYPES:remove = "wic.xz wic.bmap wic.vmdk.xz"
