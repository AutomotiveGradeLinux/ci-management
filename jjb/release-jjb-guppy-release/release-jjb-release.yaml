---
- project:
    name: release-jjb-guppy-release-from-snapshot
    jobs:
      - release-jjb-guppy-release-from-snapshot

- job-template:
    name: 'release-jjb-guppy-release-from-snapshot'
    project-type: freestyle
    concurrent: false
    node: control-slave

    parameters:
      - string:
          name: GERRIT_BRANCH
          default: guppy
          description: "branch to build"
      - string:
          name: RELEASE_BRANCH
          default: guppy
          description: "release branch to build"
      - string:
          name: RELEASE_VERSION
          default: 7.0.0
          description: "release version number for build"
      - string:
          name: UPLOAD
          default: yes_or_no
          description: "Upload?"

    build-discarder:
      days-to-keep: 30
      num-to-keep: 40
      artifact-days-to-keep: -1
      artifact-num-to-keep: 5

    wrappers:
      - agl-infra-wrappers:
          build-timeout: '{build-timeout}'

    builders:
      - shell:
          !include-raw-escape:
          - include-release-jjb-release-move-sandbox.sh
      - trigger-builds:
        - project: "release-jjb-guppy-sources"
          current-parameters: true
          block: true
          same-node: true
