---
- project:
    name: release-jjb-lamprey-sources
    jobs:
      - release-jjb-lamprey-sources

- job-template:
    name: 'release-jjb-lamprey-sources'
    project-type: freestyle
    concurrent: false
    node: agl-test-slave

    parameters:
      - string:
          name: GERRIT_BRANCH
          default: master
          description: "release version number for build"
      - string:
          name: RELEASE_VERSION
          default: 11.91.0
          description: "release version number for build"
      - string:
          name: RELEASE_BRANCH
          default: lamprey
          description: "release branch to build"
      - string:
          name: UPLOAD
          default: yes_or_no
          description: "Upload?"

    build-discarder:
      days-to-keep: 30
      num-to-keep: 40
      artifact-days-to-keep: -1
      artifact-num-to-keep: 5

    wrappers:
      - agl-infra-wrappers:
          build-timeout: '{build-timeout}'

    builders:
      - shell:
          !include-raw-escape:
          - include-release-jjb-release-sources-rsync.sh
